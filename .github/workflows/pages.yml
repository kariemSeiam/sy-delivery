name: Deploy founders reference to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "proposal/**"
      - "founders/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build founders reference (root) and legacy proposal (/proposal/)
        run: |
          python3 founders/build.py
          python3 proposal/build.py
          mkdir -p site/proposal
          cp founders/dist/index.html site/index.html
          cp proposal/dist/index.html site/proposal/index.html
          echo "syria.kariem.dev" > site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
